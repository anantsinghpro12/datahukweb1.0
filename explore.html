<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Explore More - DataHuk</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:radial-gradient(circle,#0f172a,#020617);
color:white;
overflow:hidden;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
font-size:22px;
text-decoration:none;
color:#7b61ff;
background:rgba(255,255,255,0.05);
padding:10px 15px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.1);
}

.container{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

h1{
font-size:65px;
background:linear-gradient(45deg,#00d5ff,#7b61ff);
-webkit-background-clip:text;
color:transparent;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
width:80%;
}

.box{
padding:25px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
transition:.3s;
}

.box:hover{
transform:scale(1.05);
border-color:#00d5ff;
}

</style>

</head>
<body>

<a class="back-btn" href="index.html">⬅ Home</a>

<div class="container">

<h1>Explore More</h1>

<div class="grid">

<div class="box">⚡ AI Automation Tools</div>
<div class="box">📊 Smart Dashboards</div>
<div class="box">📱 Mobile Apps UI Kits</div>
<div class="box">🌐 SaaS Systems</div>
<div class="box">☁ Cloud Architecture</div>
<div class="box">🎮 Game Engines</div>

</div>

</div>

</body>
</html>
